<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Offline for now</title>
<style>
  :root { color-scheme: light dark; --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #fafaf9; --muted: #a8a29e; } }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 0 16px;
    background: var(--bg); color: var(--fg);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 28rem; text-align: center; }
  h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 0.5rem; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>This page is offline for now.</h1>
  <p>Questions about your numbers? Ask your team lead.</p>
</main>
</body>
</html>
